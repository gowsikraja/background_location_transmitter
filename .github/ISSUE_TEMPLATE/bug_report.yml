name: 🐞 Bug Report
description: Report a bug or unexpected behavior in the plugin
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the information below to help us investigate.

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: checkboxes
    id: platform
    attributes:
      label: Affected platform(s)
      description: "Select all platforms where you've observed the bug."
      options:
        - label: Flutter (Dart)
        - label: Android
        - label: iOS
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Start tracking
        2. Close app
        3. Observe behavior
    validations:
      required: true
  
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: |
        - OS version: (e.g., Android 12, iOS 15.5)
        - Device: (e.g., Pixel 6, iPhone 13)
        - Flutter version: (run `flutter --version`)
      placeholder: |
        - OS version: 
        - Device: 
        - Flutter version: 
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      description: Paste relevant logs here (Android logcat / Xcode console).
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have checked existing issues
          required: true
